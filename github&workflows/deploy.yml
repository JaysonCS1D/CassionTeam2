name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Smoke test
        run: python -c "from src.task_manager import TaskManager; m = TaskManager(); t = m.add_task('smoke test'); print('Smoke test passed:', t)"

      - name: Deploy to Render
        if: success()
        run: echo "All tests passed - deploying to Render..."
        # Uncomment below and add RENDER_DEPLOY_HOOK in GitHub Secrets to enable real deployment:
        # run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
